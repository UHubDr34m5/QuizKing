<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07111f">
  <title>QuizKing｜クイズ王への道</title>
  <meta name="description" content="クイズ王を目指すための、ゆうすけ専用クイズトレーニングサイト。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2307111f'/%3E%3Cpath d='M13 18l10 10 9-18 9 18 10-10-5 31H18z' fill='%23ffca42'/%3E%3Ccircle cx='32' cy='37' r='7' fill='%2307111f'/%3E%3Cpath d='M36 42l6 6' stroke='%2307111f' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --bg-deep: #040c17;
      --surface: rgba(15, 31, 51, 0.88);
      --surface-strong: #0e2034;
      --surface-soft: rgba(255, 255, 255, 0.045);
      --line: rgba(148, 163, 184, 0.14);
      --line-strong: rgba(148, 163, 184, 0.22);
      --text: #f7fafc;
      --muted: #91a3b9;
      --subtle: #667a91;
      --gold: #ffca42;
      --gold-light: #ffe186;
      --cyan: #5ee7f2;
      --cyan-soft: rgba(94, 231, 242, 0.1);
      --radius-xl: 1.875rem;
      --radius-lg: 1.3rem;
      --shadow: 0 24px 70px rgba(0, 6, 16, 0.24);
      font-family: Inter, "Avenir Next", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 74% 8%, rgba(42, 202, 219, 0.16), transparent 28rem),
        radial-gradient(circle at 24% 86%, rgba(255, 190, 61, 0.1), transparent 26rem),
        var(--bg);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.32;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 3.5rem 3.5rem;
      mask-image: linear-gradient(to bottom, #000, transparent 82%);
    }

    button { font: inherit; }
    svg { display: block; }

    .icon {
      width: 1.4rem;
      height: 1.4rem;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 5.5rem minmax(0, 1fr);
      min-height: 100vh;
    }

    .rail {
      position: sticky;
      top: 0;
      display: flex;
      height: 100vh;
      flex-direction: column;
      align-items: center;
      padding: 1.4rem 0;
      border-right: 1px solid var(--line);
      background: rgba(4, 12, 24, 0.52);
      backdrop-filter: blur(1rem);
    }

    .brand-mark {
      position: relative;
      display: grid;
      width: 3rem;
      height: 3rem;
      place-items: center;
      border-radius: 0.95rem 0.95rem 1.1rem 1.1rem;
      color: #111827;
      background: linear-gradient(145deg, var(--gold-light), #ffb51e);
      box-shadow: 0 0.75rem 2rem rgba(255, 190, 47, 0.18);
      font-size: 1.05rem;
      font-weight: 950;
      letter-spacing: -0.08em;
    }

    .brand-mark::before {
      content: "";
      position: absolute;
      top: -0.42rem;
      width: 1.65rem;
      height: 0.58rem;
      background: var(--gold-light);
      clip-path: polygon(0 100%, 12% 0, 36% 56%, 52% 0, 72% 58%, 100% 8%, 90% 100%);
    }

    .rail-nav {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 3.25rem;
    }

    .nav-item,
    .rail-settings {
      display: grid;
      width: 3rem;
      height: 3rem;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 1rem;
      color: #61778f;
      background: transparent;
    }

    .nav-item[aria-current="page"] {
      color: var(--cyan);
      background: var(--cyan-soft);
      box-shadow: inset 0 0 0 1px rgba(94, 231, 242, 0.12);
    }

    .nav-item:disabled,
    .rail-settings:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .content {
      width: min(85rem, 100%);
      margin: 0 auto;
      padding: 1.6rem clamp(1.6rem, 4vw, 4.1rem) 2.4rem;
    }

    .topbar {
      display: flex;
      min-height: 3.5rem;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 1.7rem;
    }

    .wordmark {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      min-width: 0;
    }

    .wordmark strong {
      font-size: 1.4rem;
      letter-spacing: -0.04em;
    }

    .wordmark span {
      color: #60738b;
      font: 750 0.75rem/1 monospace;
      letter-spacing: 0.17em;
      white-space: nowrap;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .avatar {
      display: grid;
      width: 2.5rem;
      height: 2.5rem;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 50%;
      color: #dbeafe;
      background: #14243b;
      font-size: 0.8rem;
      font-weight: 850;
    }

    .dashboard {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(20.5rem, 0.85fr);
      gap: 1.35rem;
    }

    .panel {
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(0.9rem);
    }

    .hero {
      position: relative;
      min-height: 22.5rem;
      padding: clamp(2rem, 4vw, 3.5rem);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }

    .hero::before {
      content: "Q";
      position: absolute;
      right: -1.5rem;
      bottom: -6.3rem;
      color: rgba(94, 231, 242, 0.035);
      font-size: 24rem;
      font-weight: 1000;
      line-height: 1;
      letter-spacing: -0.16em;
      pointer-events: none;
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--gold);
      font: 800 0.78rem/1.2 monospace;
      letter-spacing: 0.12em;
    }

    .eyebrow::before {
      content: "";
      width: 1.8rem;
      height: 2px;
      background: var(--gold);
    }

    .hero h1 {
      position: relative;
      z-index: 1;
      max-width: 38rem;
      margin: 1.5rem 0 0.9rem;
      font-size: clamp(2.75rem, 5vw, 4.7rem);
      line-height: 1.03;
      letter-spacing: -0.06em;
    }

    .hero h1 em {
      color: var(--cyan);
      font-style: normal;
    }

    .hero-copy {
      position: relative;
      z-index: 1;
      max-width: 31rem;
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.85;
    }

    .hero-action {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 2.1rem;
    }

    .start-button {
      display: inline-flex;
      min-height: 3.45rem;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      padding: 0 1.5rem;
      border: 0;
      border-radius: 0.95rem;
      color: #142033;
      background: linear-gradient(135deg, var(--gold-light), #ffc038);
      box-shadow: 0 0.95rem 2.1rem rgba(255, 193, 56, 0.15);
      font-size: 1rem;
      font-weight: 900;
    }

    .start-button:disabled {
      cursor: not-allowed;
      filter: saturate(0.72);
      opacity: 0.78;
    }

    .empty-note {
      color: #74879d;
      font-size: 0.82rem;
      line-height: 1.55;
    }

    .score {
      display: flex;
      min-height: 22.5rem;
      flex-direction: column;
      padding: 1.85rem;
      border-radius: var(--radius-xl);
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .panel-heading h2 {
      margin: 0;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    .season-chip {
      padding: 0.42rem 0.65rem;
      border-radius: 999px;
      color: #8497ad;
      background: var(--surface-soft);
      font-size: 0.7rem;
      white-space: nowrap;
    }

    .rank-ring {
      position: relative;
      display: grid;
      width: 11rem;
      height: 11rem;
      place-items: center;
      margin: 1.55rem auto 1.3rem;
      border-radius: 50%;
      background: conic-gradient(var(--gold) 0deg 4deg, #1a2c43 4deg 360deg);
      box-shadow: 0 0 3.75rem rgba(94, 231, 242, 0.05);
    }

    .rank-ring::before {
      content: "";
      position: absolute;
      inset: 0.65rem;
      border-radius: inherit;
      background: #0d1d31;
    }

    .rank-copy {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .rank-copy strong {
      display: block;
      font-size: 3rem;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .rank-copy span {
      display: block;
      margin-top: 0.6rem;
      color: #8194aa;
      font: 0.7rem/1 monospace;
      letter-spacing: 0.11em;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: auto;
    }

    .stat {
      padding: 0 0.35rem;
      border-right: 1px solid var(--line);
      text-align: center;
    }

    .stat:last-child { border: 0; }

    .stat strong {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 1.2rem;
    }

    .stat span {
      color: #74879e;
      font-size: 0.72rem;
    }

    .training-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin: 1.7rem 0.15rem 0.8rem;
    }

    .training-heading h2 {
      margin: 0;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    .training-heading span {
      color: var(--subtle);
      font-size: 0.78rem;
    }

    .training-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.9rem;
    }

    .mode-card {
      min-height: 9.4rem;
      padding: 1.3rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      opacity: 0.72;
      backdrop-filter: blur(0.75rem);
    }

    .mode-icon {
      display: grid;
      width: 2.45rem;
      height: 2.45rem;
      place-items: center;
      margin-bottom: 1.05rem;
      border-radius: 0.8rem;
      color: #8ba1ba;
      background: var(--surface-soft);
    }

    .mode-icon .icon {
      width: 1.2rem;
      height: 1.2rem;
    }

    .mode-card h3 {
      margin: 0 0 0.45rem;
      font-size: 0.9rem;
    }

    .mode-card p {
      margin: 0;
      color: #71859c;
      font-size: 0.8rem;
      line-height: 1.55;
    }

    @media (max-width: 980px) {
      .dashboard { grid-template-columns: 1fr; }
      .score { min-height: auto; }
      .rank-ring { margin-block: 1.2rem; }
    }

    @media (max-width: 720px) {
      .app {
        display: block;
        padding-bottom: 5rem;
      }

      .rail {
        position: fixed;
        z-index: 20;
        inset: auto 0 0;
        width: 100%;
        height: 4.4rem;
        flex-direction: row;
        padding: 0.45rem 1rem max(0.45rem, env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        border-right: 0;
        background: rgba(4, 12, 24, 0.9);
      }

      .brand-mark,
      .rail-settings { display: none; }

      .rail-nav {
        width: 100%;
        flex-direction: row;
        justify-content: space-around;
        gap: 0.3rem;
        margin: 0;
      }

      .nav-item {
        width: 3.3rem;
        height: 3.3rem;
      }

      .content { padding: 1.15rem 1rem 1.7rem; }
      .topbar { margin-bottom: 1.1rem; }
      .wordmark span,
      .profile > span { display: none; }
      .dashboard { gap: 0.9rem; }
      .hero { min-height: 21.2rem; padding: 1.7rem 1.45rem; border-radius: 1.5rem; }
      .hero::before { right: -2rem; bottom: -4.7rem; font-size: 18rem; }
      .hero h1 { margin-top: 1.3rem; font-size: clamp(2.6rem, 13vw, 3.6rem); }
      .hero-copy { font-size: 0.9rem; }
      .hero-action { align-items: stretch; flex-direction: column; margin-top: 1.65rem; }
      .empty-note { text-align: center; }
      .score { padding: 1.45rem; border-radius: 1.5rem; }
      .rank-ring { width: 9.5rem; height: 9.5rem; }
      .training-heading { margin-top: 1.35rem; }
      .training-heading span { display: none; }
      .training-grid { grid-template-columns: 1fr; }
      .mode-card {
        display: grid;
        min-height: 6.3rem;
        grid-template-columns: 2.45rem 1fr;
        column-gap: 1rem;
        align-items: center;
      }
      .mode-icon { grid-row: 1 / 3; margin: 0; }
      .mode-card h3 { align-self: end; }
      .mode-card p { align-self: start; }
    }

    @media (max-width: 390px) {
      .hero { padding-inline: 1.2rem; }
      .hero h1 { font-size: 2.55rem; }
      .score { padding-inline: 1.1rem; }
      .stat span { font-size: 0.68rem; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero,
      .score,
      .mode-card {
        animation: rise 0.55s ease-out both;
      }
      .score { animation-delay: 0.06s; }
      .mode-card:nth-child(1) { animation-delay: 0.11s; }
      .mode-card:nth-child(2) { animation-delay: 0.16s; }
      .mode-card:nth-child(3) { animation-delay: 0.21s; }

      @keyframes rise {
        from { opacity: 0; transform: translateY(0.75rem); }
        to { opacity: 1; transform: translateY(0); }
      }

      .mode-card { animation-fill-mode: both; }
      .mode-card[aria-disabled="true"] { opacity: 0.72; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="メインナビゲーション">
      <div class="brand-mark" aria-label="QuizKing">QK</div>
      <nav class="rail-nav" aria-label="ページ">
        <button class="nav-item" type="button" aria-current="page" aria-label="ホーム">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
        </button>
        <button class="nav-item" type="button" disabled aria-label="クイズ（問題追加後に利用可能）">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg>
        </button>
        <button class="nav-item" type="button" disabled aria-label="成績（回答後に利用可能）">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m6 10V5m6 14v-7m5 7H2"/></svg>
        </button>
        <button class="nav-item" type="button" disabled aria-label="称号（現在は利用できません）">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="m8.5 14-1 8 4.5-2 4.5 2-1-8"/></svg>
        </button>
      </nav>
      <button class="rail-settings" type="button" disabled aria-label="設定（現在は利用できません）">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 15a1.8 1.8 0 0 0 .4 2l-2.4 2.4a1.8 1.8 0 0 0-2-.4 1.8 1.8 0 0 0-1.1 1.6V21h-3.8v-.4A1.8 1.8 0 0 0 9 19a1.8 1.8 0 0 0-2 .4L4.6 17a1.8 1.8 0 0 0 .4-2 1.8 1.8 0 0 0-1.6-1.1H3v-3.8h.4A1.8 1.8 0 0 0 5 9a1.8 1.8 0 0 0-.4-2L7 4.6A1.8 1.8 0 0 0 9 5a1.8 1.8 0 0 0 1.1-1.6V3h3.8v.4A1.8 1.8 0 0 0 15 5a1.8 1.8 0 0 0 2-.4L19.4 7a1.8 1.8 0 0 0-.4 2 1.8 1.8 0 0 0 1.6 1.1h.4v3.8h-.4A1.8 1.8 0 0 0 19 15Z"/></svg>
      </button>
    </aside>

    <main class="content">
      <header class="topbar">
        <div class="wordmark">
          <strong>QuizKing</strong>
          <span>PERSONAL QUIZ ARENA</span>
        </div>
        <div class="profile">
          <span>ゆうすけさん</span>
          <div class="avatar" aria-hidden="true">YK</div>
        </div>
      </header>

      <div class="dashboard">
        <section class="hero panel" aria-labelledby="hero-title">
          <span class="eyebrow">ROAD TO QUIZ KING</span>
          <h1 id="hero-title">0問から、<br><em>王座</em>へ。</h1>
          <p class="hero-copy">知識を積み上げ、苦手を攻略する。<br>あなた専用のクイズトレーニングを始めよう。</p>
          <div class="hero-action">
            <button class="start-button" type="button" disabled aria-describedby="start-note">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg>
              クイズを始める
            </button>
            <span class="empty-note" id="start-note">問題を追加すると<br>プレイできます</span>
          </div>
        </section>

        <aside class="score panel" aria-labelledby="score-title">
          <div class="panel-heading">
            <h2 id="score-title">現在のステータス</h2>
            <span class="season-chip">SEASON 01</span>
          </div>
          <div class="rank-ring" aria-label="総回答数 0回">
            <div class="rank-copy"><strong>0</strong><span>TOTAL PLAY</span></div>
          </div>
          <div class="stats">
            <div class="stat"><strong>—</strong><span>正答率</span></div>
            <div class="stat"><strong>0</strong><span>連続正解</span></div>
            <div class="stat"><strong>0</strong><span>登録問題</span></div>
          </div>
        </aside>
      </div>

      <div class="training-heading">
        <h2>TRAINING MODE</h2>
        <span>問題登録後に解放されます</span>
      </div>

      <section class="training-grid" aria-label="トレーニングモード">
        <article class="mode-card" aria-disabled="true">
          <div class="mode-icon">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7Z"/><path d="m19 17 .8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8Z"/></svg>
          </div>
          <h3>ランダムチャレンジ</h3>
          <p>全分野からランダムに出題</p>
        </article>
        <article class="mode-card" aria-disabled="true">
          <div class="mode-icon">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
          </div>
          <h3>苦手克服</h3>
          <p>不正解問題を集中トレーニング</p>
        </article>
        <article class="mode-card" aria-disabled="true">
          <div class="mode-icon">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c4.4 0 8-3.1 8-7.5 0-3-1.6-5.7-4.1-7.2.1 2.1-.7 3.7-2.2 4.9.1-4.1-2.2-7.5-5.5-9.6.2 3.6-2.2 5.6-3.4 8C3.7 13.1 4 16 5.6 18.2 7 20.2 9.2 22 12 22Z"/></svg>
          </div>
          <h3>タイムアタック</h3>
          <p>制限時間内の正解数に挑戦</p>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
